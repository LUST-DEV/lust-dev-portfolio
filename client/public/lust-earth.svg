<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="title desc">
  <title id="title">Planète Terre stylisée</title>
  <desc id="desc">Une planète Terre bleue et noire vue depuis l’espace avec une atmosphère néon.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="45%"><stop stop-color="#17263b"/><stop offset="1" stop-color="#03060d"/></radialGradient>
    <radialGradient id="earth" cx="34%" cy="26%"><stop stop-color="#6dbbc1"/><stop offset=".42" stop-color="#174b63"/><stop offset=".82" stop-color="#071421"/><stop offset="1" stop-color="#02050a"/></radialGradient>
